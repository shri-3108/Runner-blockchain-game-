name: Deploy to Kwela Network

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    - name: Compile contracts
      run: npx hardhat compile

    - name: Deploy to Kwela
      env:
        KWELA_RPC_URL: ${{ secrets.KWELA_RPC_URL }}
        KWELA_PRIVATE_KEY: ${{ secrets.KWELA_PRIVATE_KEY }}
      run: |
        npx hardhat run scripts/deploy.js --network kwela
